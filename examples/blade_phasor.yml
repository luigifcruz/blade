---
version: 2
title: BLADE Phasor
summary: Barebones beamforming phasor generation.
graph:
  - name: file_reader
    module: file_reader
    device: cpu
    runtime: native
    provider: generic
    config:
      filepath: /home/sdk/blade/antennaPositions.bin
      fileFormat: raw
      dataType: F64
      batchSize: 24
      loop: true
      playing: true
    meta:
      node:
        x: 201
        y: 171.5
        width: 140
        height: 0
  - name: ones_tensor
    module: ones_tensor
    device: cpu
    runtime: native
    provider: generic
    config:
      shape: '[2]'
      dataType: F64
    meta:
      node:
        x: 468
        y: 636.5
        width: 140
        height: 0
  - name: ones_tensor_2
    module: ones_tensor
    device: cpu
    runtime: native
    provider: generic
    config:
      shape: '[1]'
      dataType: F64
    meta:
      node:
        x: 441
        y: 967
        width: 140
        height: 0
  - name: ones_tensor_3
    module: ones_tensor
    device: cpu
    runtime: native
    provider: generic
    config:
      shape: '[1]'
      dataType: F64
    meta:
      node:
        x: 427
        y: 1144
        width: 140
        height: 0
  - name: ones_tensor_4
    module: ones_tensor
    device: cpu
    runtime: native
    provider: generic
    config:
      shape: '[8, 1024, 2]'
      dataType: CF64
    meta:
      node:
        x: 474
        y: 469
        width: 140
        height: 0
  - name: ones_tensor_1
    module: ones_tensor
    device: cpu
    runtime: native
    provider: generic
    config:
      shape: '[2, 2]'
      dataType: F64
    meta:
      node:
        x: 462
        y: 798
        width: 140
        height: 0
  - name: throttle
    module: throttle
    device: cpu
    runtime: native
    provider: generic
    config:
      intervalMs: 1000
    input:
      buffer: '${graph.file_reader.output.signal}'
    meta:
      node:
        x: 459
        y: 247.5
        width: 140
        height: 0
  - name: multiply_constant
    module: multiply_constant
    device: cpu
    runtime: native
    provider: generic
    config:
      constant: 2.4
    input:
      factor: '${graph.ones_tensor.output.buffer}'
    meta:
      node:
        x: 721
        y: 669.5
        width: 140
        height: 0
  - name: multiply_constant_2
    module: multiply_constant
    device: cpu
    runtime: native
    provider: generic
    config:
      constant: 2461210.2
    input:
      factor: '${graph.ones_tensor_2.output.buffer}'
    meta:
      node:
        x: 713
        y: 985
        width: 140
        height: 0
  - name: multiply_constant_3
    module: multiply_constant
    device: cpu
    runtime: native
    provider: generic
    config:
      constant: 0.001
    input:
      factor: '${graph.ones_tensor_3.output.buffer}'
    meta:
      node:
        x: 714
        y: 1132
        width: 140
        height: 0
  - name: multiply_constant_1
    module: multiply_constant
    device: cpu
    runtime: native
    provider: generic
    config:
      constant: 2.4
    input:
      factor: '${graph.ones_tensor_1.output.buffer}'
    meta:
      node:
        x: 719
        y: 831
        width: 140
        height: 0
  - name: reshape
    module: reshape
    device: cpu
    runtime: native
    provider: generic
    config:
      shape: '[8, 3]'
      contiguous: true
    input:
      buffer: '${graph.throttle.output.buffer}'
    meta:
      node:
        x: 712
        y: 285.5
        width: 140
        height: 0
  - name: phasor
    module: phasor
    device: cpu
    runtime: native
    provider: generic
    config:
      observationFrequencyHz: 1400000000
      channelBandwidthHz: 1000000
      totalBandwidthHz: 1000000
      frequencyStartIndex: 0
      referenceAntennaIndex: 0
      arrayReferenceLongitude: -0.9228426136978515
      arrayReferenceLatitude: -0.698302847784055
      arrayReferenceAltitude: 818.6837417125288
    input:
      julianDate: '${graph.multiply_constant_2.output.product}'
      boresightCoordinates: '${graph.multiply_constant.output.product}'
      antennaPositions: '${graph.reshape.output.buffer}'
      antennaCalibrations: '${graph.ones_tensor_4.output.buffer}'
      beamCoordinates: '${graph.multiply_constant_1.output.product}'
      dut1: '${graph.multiply_constant_3.output.product}'
    meta:
      node:
        x: 1201
        y: 617.5
        width: 140
        height: 0
